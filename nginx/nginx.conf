events {}
http { upstream frontend { server frontend:3000; } upstream backend { server backend:8000; } server { listen 80; location /api/ { proxy_pass http://backend; proxy_set_header Host $host; } location / { proxy_pass http://frontend; proxy_set_header Host $host; } add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options SAMEORIGIN always; add_header Referrer-Policy strict-origin-when-cross-origin always; } }