name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy over SSH
        run: |
          set -Eeuo pipefail
          echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"
          LOG_FILE="deployment-${{ github.run_id }}.log"
          set -o pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -p "${{ secrets.PORT }}" \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}" 'bash -se' <<'REMOTE_SCRIPT' 2>&1 | tee "${LOG_FILE}"
          set -Eeuo pipefail
          APP_DIR="/home/yuri/pomvix"
          echo "Changing to ${APP_DIR}"
          cd "${APP_DIR}"
          echo "[1/2] Pulling the latest main branch..."
          git pull origin main
          git rev-parse --short HEAD
          echo "[2/2] Running the versioned deployment script..."
          ./scripts/deploy-production.sh
          REMOTE_SCRIPT

      - name: Upload deployment log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-log-${{ github.run_id }}
          path: deployment-${{ github.run_id }}.log
          if-no-files-found: warn

      - name: Report deployment duration
        if: always()
        run: |
          end=$(date +%s)
          start=${DEPLOY_START:-$end}
          duration=$((end - start))
          echo "Deployment duration: ${duration}s"
